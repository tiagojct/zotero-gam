<linkset>
  <html:link rel="localization" href="gam.ftl"/>
</linkset>
<vbox id="gam-prefs">
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-title"/></label>
    <description data-l10n-id="gam-pref-intro"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-vault"/></label>
    <label data-l10n-id="gam-pref-vault"/>
    <html:input type="text" preference="extensions.gam.vault"/>
    <description data-l10n-id="gam-pref-vault-help"/>
    <label data-l10n-id="gam-pref-vault-name"/>
    <html:input type="text" preference="extensions.gam.vaultName"/>
    <label data-l10n-id="gam-pref-literature"/>
    <html:input type="text" preference="extensions.gam.literatureFolder"/>
    <description data-l10n-id="gam-pref-literature-help"/>
    <label data-l10n-id="gam-pref-exclude"/>
    <html:input type="text" preference="extensions.gam.exclude"/>
    <description data-l10n-id="gam-pref-exclude-help"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-notes"/></label>
    <label data-l10n-id="gam-pref-marker"/>
    <html:input type="text" preference="extensions.gam.marker"/>
    <description data-l10n-id="gam-pref-marker-help"/>
    <checkbox preference="extensions.gam.openAfterCreate" data-l10n-id="gam-pref-open-after-create"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-keys"/></label>
    <checkbox preference="extensions.gam.autoKey" data-l10n-id="gam-pref-auto-key"/>
    <description data-l10n-id="gam-pref-auto-key-help"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-clean"/></label>
    <checkbox preference="extensions.gam.cleanNew" data-l10n-id="gam-pref-clean-new"/>
    <description data-l10n-id="gam-pref-clean-new-help"/>
    <checkbox preference="extensions.gam.orphanNotice" data-l10n-id="gam-pref-orphan-notice"/>
    <label data-l10n-id="gam-pref-terms-file"/>
    <html:input type="text" preference="extensions.gam.termsFile"/>
    <description data-l10n-id="gam-pref-terms-file-help"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-import"/></label>
    <checkbox preference="extensions.gam.importOn" data-l10n-id="gam-pref-import-on"/>
    <label data-l10n-id="gam-pref-import-folder"/>
    <html:input type="text" preference="extensions.gam.importFolder"/>
    <description data-l10n-id="gam-pref-import-folder-help"/>
    <label data-l10n-id="gam-pref-import-done"/>
    <html:input type="text" preference="extensions.gam.importDone"/>
    <description data-l10n-id="gam-pref-import-done-help"/>
  </groupbox>
</vbox>
