<linkset>
  <html:link rel="localization" href="gam.ftl"/>
</linkset>
<vbox id="gam-prefs">
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-title"/></label>
    <description data-l10n-id="gam-pref-intro"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-vault"/></label>
    <label id="gam-pref-vault-label" data-l10n-id="gam-pref-vault"/>
    <html:input type="text" aria-labelledby="gam-pref-vault-label" preference="extensions.gam.vault"/>
    <description data-l10n-id="gam-pref-vault-help"/>
    <label id="gam-pref-vault-name-label" data-l10n-id="gam-pref-vault-name"/>
    <html:input type="text" aria-labelledby="gam-pref-vault-name-label" preference="extensions.gam.vaultName"/>
    <label id="gam-pref-literature-label" data-l10n-id="gam-pref-literature"/>
    <html:input type="text" aria-labelledby="gam-pref-literature-label" preference="extensions.gam.literatureFolder"/>
    <description data-l10n-id="gam-pref-literature-help"/>
    <label id="gam-pref-exclude-label" data-l10n-id="gam-pref-exclude"/>
    <html:input type="text" aria-labelledby="gam-pref-exclude-label" preference="extensions.gam.exclude"/>
    <description data-l10n-id="gam-pref-exclude-help"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-notes"/></label>
    <label id="gam-pref-marker-label" data-l10n-id="gam-pref-marker"/>
    <html:input type="text" aria-labelledby="gam-pref-marker-label" preference="extensions.gam.marker"/>
    <description data-l10n-id="gam-pref-marker-help"/>
    <checkbox preference="extensions.gam.openAfterCreate" data-l10n-id="gam-pref-open-after-create"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-keys"/></label>
    <checkbox preference="extensions.gam.autoKey" data-l10n-id="gam-pref-auto-key"/>
    <description data-l10n-id="gam-pref-auto-key-help"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-clean"/></label>
    <checkbox preference="extensions.gam.cleanNew" data-l10n-id="gam-pref-clean-new"/>
    <description data-l10n-id="gam-pref-clean-new-help"/>
    <checkbox preference="extensions.gam.orphanNotice" data-l10n-id="gam-pref-orphan-notice"/>
    <label id="gam-pref-terms-file-label" data-l10n-id="gam-pref-terms-file"/>
    <html:input type="text" aria-labelledby="gam-pref-terms-file-label" preference="extensions.gam.termsFile"/>
    <description data-l10n-id="gam-pref-terms-file-help"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-import"/></label>
    <checkbox preference="extensions.gam.importOn" data-l10n-id="gam-pref-import-on"/>
    <label id="gam-pref-import-folder-label" data-l10n-id="gam-pref-import-folder"/>
    <html:input type="text" aria-labelledby="gam-pref-import-folder-label" preference="extensions.gam.importFolder"/>
    <description data-l10n-id="gam-pref-import-folder-help"/>
    <label id="gam-pref-import-done-label" data-l10n-id="gam-pref-import-done"/>
    <html:input type="text" aria-labelledby="gam-pref-import-done-label" preference="extensions.gam.importDone"/>
    <description data-l10n-id="gam-pref-import-done-help"/>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="gam-pref-group-pdfs"/></label>
    <checkbox preference="extensions.gam.openAlexPDFs" data-l10n-id="gam-pref-openalex-pdfs"/>
    <description data-l10n-id="gam-pref-openalex-pdfs-help"/>
    <label id="gam-pref-openalex-key-label" data-l10n-id="gam-pref-openalex-key"/>
    <html:input type="password" id="gam-pref-openalex-key" aria-labelledby="gam-pref-openalex-key-label" aria-describedby="gam-pref-openalex-key-help gam-pref-openalex-key-status" autocomplete="off"/>
    <description id="gam-pref-openalex-key-help" data-l10n-id="gam-pref-openalex-key-help"/>
    <html:div id="gam-pref-openalex-key-status" role="status" aria-live="polite"/>
  </groupbox>
</vbox>
